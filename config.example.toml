[graph]
# Shared TwoDrive public application; override only for a custom registration.
client_id = "178705ac-2286-441b-9652-1a4d86be2c51"
tenant = "common"
redirect_uri = "http://localhost:53682"
scopes = [
    "Files.ReadWrite",
    "User.Read",
    "offline_access",
    "openid",
    "profile",
]

[cache]
retain_for = "30d"
max_size = "20GiB"

[power]
ac_sync_interval = "15m"
battery_sync_interval = "60m"
ac_download_concurrency = 4
battery_download_concurrency = 1

[known_folders]
enabled = false
mode = "upload_only"
debounce = "5s"
rescan_interval = "0s"
startup_scan = false
upload_deletes = false
# Exact names apply to every component below a source, including old queues.
exclude_names = ["node_modules"]
# Sliding churn budgets; first uploads and admitted-generation retries are free.
upload_rate_window = "20s"
max_file_uploads_per_window = 25
max_project_uploads_per_window = 180
# Optional absolute/~ project roots. Otherwise detect only after a hot threshold.
upload_rate_roots = []
exclude_suffixes = [
    ".crdownload",
    ".part",
    ".tmp",
    ".download",
    ".temp",
    ".partial",
    ".filepart",
    ".opdownload",
    ".aria2",
    ".!qB",
    ".swp",
    ".swo",
    ".swx",
    ".bak",
]

[[known_folders.folders]]
local = "~/Pictures"
remote = "/Pictures"

[[known_folders.folders]]
local = "~/Downloads"
remote = "/Downloads"
