name: Windows dual preview
on:
  push:
    branches: [dev]
  workflow_dispatch:
  pull_request:
    paths: ['crates/**', 'apps/full/**', 'scripts/*windows*', 'Cargo.*', 'experiments/twodrive-dev/**', '.github/workflows/windows-preview.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
      - shell: pwsh
        run: ./scripts/build-windows.ps1 -OutputDirectory "$env:RUNNER_TEMP/packages" -IncludeDevTools
      - shell: pwsh
        run: python scripts/test-windows-ipc.py --engine target/release/twodrive-engine.exe
      - shell: pwsh
        run: |
          $packages = @(Get-ChildItem "$env:RUNNER_TEMP/packages" -Directory)
          foreach ($tool in @('twodrive-peer.exe', 'twodrive-dev.exe')) {
            $hashes = @($packages | ForEach-Object { (Get-FileHash (Join-Path $_.FullName $tool)).Hash } | Select-Object -Unique)
            if ($hashes.Count -ne 1) { throw "Full/Lite contain different $tool binaries" }
          }
          $lite = $packages | Where-Object { $_.Name -match '-Lite-' }
          python experiments/twodrive-dev/scripts/smoke.py --binary (Join-Path $lite.FullName 'twodrive-dev.exe') --network lan
          if ($LASTEXITCODE) { throw "Packaged QUIC smoke failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dual-preview
          path: ${{ runner.temp }}/packages
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 -m unittest discover -s packaging/nautilus -p 'test_*.py'
