name: Windows dual preview
on:
  workflow_dispatch:
  pull_request:
    paths: ['crates/**', 'apps/full/**', 'scripts/*windows*', 'Cargo.*', '.github/workflows/windows-preview.yml']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
      - shell: pwsh
        run: ./scripts/build-windows.ps1 -OutputDirectory "$env:RUNNER_TEMP/packages"
      - shell: pwsh
        run: python scripts/test-windows-ipc.py --engine target/release/twodrive-engine.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dual-preview
          path: ${{ runner.temp }}/packages
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 -m unittest discover -s packaging/nautilus -p 'test_*.py'
