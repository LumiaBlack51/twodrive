name: Debian packaging policy
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    name: Debian packaging policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-debian-policy.py
      - run: python3 -m unittest discover -s scripts -p 'test_dav_debian_package.py'
