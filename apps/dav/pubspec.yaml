name: twodrive_dav
description: TwoDrive Development for Linux and Windows, with extensible storage providers.
publish_to: none
version: 0.1.7+8
environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  window_manager: 0.5.1
  file_selector: 1.1.0
dev_dependencies:
  file_selector_platform_interface: 2.7.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/Noto-LICENSE.txt
    - assets/fonts/Roboto-LICENSE.txt
    - assets/fonts/DejaVu-LICENSE.txt
  fonts:
    - family: TwoDriveSans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: TwoDriveCJK
      fonts:
        - asset: assets/fonts/NotoSansCJKSC-Regular.otf
          weight: 400
        - asset: assets/fonts/NotoSansCJKSC-Bold.otf
          weight: 700
    - family: TwoDriveMono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
