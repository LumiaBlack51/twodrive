[package]
name = "twodrive-dev"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.91"

# An isolated experiment: the stable workspace and its lockfile are untouched.
[workspace]

[features]
default = []
mount = ["dep:twodrive-fs", "dep:fuser"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
cap-std = "4"
clap = { version = "4", features = ["derive"] }
dav-server = { version = "=0.11.0", default-features = false }
fs2 = "0.4"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
httpdate = "1"
libc = "0.2"
tempfile = "3"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
percent-encoding = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
twodrive-backend = { path = "../../crates/twodrive-backend" }
twodrive-core = { path = "../../crates/twodrive-core" }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
twodrive-fs = { path = "../../crates/twodrive-fs", optional = true }
fuser = { version = "0.15", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"
