[package]
name = "twodrive-cfapi-probe"
version = "0.1.7-alpha.2"
edition = "2024"
license = "MIT"
publish = false

# An opt-in native experiment, never loaded by the installed desktop.
[workspace]

[features]
default = []
fixture-probe = ["dep:windows-sys"]
native-local-fixture = ["fixture-probe", "dep:windows", "dep:windows-collections"]
native-test-hooks = ["native-local-fixture"]
native-sync = ["fixture-probe"]

[[bin]]
name = "twodrive-cfapi-probe"
path = "src/main.rs"
required-features = ["fixture-probe"]

[dependencies]
twodrive-core = { path = "../../crates/twodrive-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
anyhow = "1"
tempfile = "3"
sha2 = "0.10"
twodrive-backend = { path = "../../crates/twodrive-backend" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_CloudFilters", "Win32_Storage_FileSystem", "Win32_System_CorrelationVector", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }
windows = { version = "0.62.2", optional = true, features = ["Storage", "Storage_Search", "Storage_Provider", "Storage_Streams", "Security_Cryptography", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_Security_Authorization", "Win32_System_Threading"] }
windows-collections = { version = "0.3.2", optional = true }

[profile.dev]
debug = 0

[profile.release]
strip = true
