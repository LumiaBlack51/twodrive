[workspace]
members = [
    "crates/twodrive-backend",
    "crates/twodrive-cli",
    "crates/twodrive-core",
    "crates/twodrive-daemon",
    "crates/twodrive-fs",
    "crates/twodrive-windows",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
fuser = { version = "0.15", default-features = false }
libc = "0.2"
notify = "6.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing"] }
toml = "0.8"
twodrive-backend = { path = "crates/twodrive-backend" }
twodrive-core = { path = "crates/twodrive-core" }
twodrive-fs = { path = "crates/twodrive-fs" }
url = "2.5"
